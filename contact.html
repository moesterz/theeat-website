<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Contact — Eat</title>
<meta name="theme-color" content="#F6F1EA">
<link rel="icon" href="icon-solo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
html,body{height:100%}body{display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
.ct{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(40px,7vw,120px);align-items:center;width:min(1120px,calc(100% - 48px));margin:0 auto;padding:12px 0;overflow:auto}
.ct h1{font-size:clamp(34px,4.4vw,56px);letter-spacing:-.045em;line-height:1}.ct h1 .dot{color:var(--accent)}
.ct .sub-l{font-size:16px;color:var(--mid);margin-top:14px;max-width:30ch;line-height:1.45}
.routes{display:flex;flex-direction:column;gap:18px;margin-top:36px}
.routes div{display:flex;flex-direction:column;gap:2px}.routes .k{font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}.routes .v{font-size:15px;font-weight:600;color:var(--ink)}.routes .v a{color:var(--ink)}.routes .v a:hover{color:var(--accent)}
.card{background:var(--card);border-radius:28px;box-shadow:0 1px 0 var(--line),0 30px 60px -40px rgba(24,19,15,.25);padding:8px 8px 8px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.fields{display:flex;flex-direction:column}
.f{display:flex;flex-direction:column;gap:3px;padding:16px 22px;border-radius:20px;transition:background .2s}.f:hover{background:var(--bg)}.f:focus-within{background:var(--bg)}
.f+.f{border-top:1px solid var(--line)}.f:focus-within+.f,.f:hover+.f{border-top-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr}.two .f+.f{border-top:0;border-left:1px solid var(--line)}
.f label{font-size:12.5px;font-weight:600;color:var(--faint);letter-spacing:.02em}
.f input,.f textarea{font:inherit;font-size:17px;font-weight:600;color:var(--ink);border:0;background:transparent;outline:0;padding:0;width:100%;letter-spacing:-.01em;resize:none;text-overflow:ellipsis}
.f textarea{font-weight:500;line-height:1.5;min-height:80px}
.f ::placeholder{color:#C9BFB3;font-weight:500}
.send{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px 12px 22px;border-top:1px solid var(--line)}.send .note{font-size:13.5px;color:var(--faint)}
.send .btn{display:inline-flex;align-items:center;gap:8px}.send .btn svg{transition:transform .3s var(--spring)}.send .btn:hover svg{transform:translateX(3px)}
.sent{position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;opacity:0;pointer-events:none;transition:opacity .4s}.sent.on{opacity:1;pointer-events:auto}
.sent .tick{width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:18px;animation:pop .6s var(--spring) both}
.sent b{display:block;font-size:28px;letter-spacing:-.035em;margin-bottom:8px}.sent span{color:var(--mid);font-size:15px;max-width:30ch}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.one-foot{margin-top:0;padding:16px 0 20px;flex:none}
@media (max-width:820px){body{overflow:auto}.ct{grid-template-columns:1fr;gap:28px;align-items:start}.two{grid-template-columns:1fr}.two .f+.f{border-left:0;border-top:1px solid var(--line)}}
/*m*/@media (max-width:760px){.ct{grid-template-columns:1fr;gap:22px;align-items:start;padding:20px 0 0;overflow:visible}.ct h1{font-size:34px}.routes{flex-direction:row;flex-wrap:wrap;gap:12px 28px;margin-top:20px}.card{border-radius:24px}.f{padding:14px 18px}.send{flex-direction:column;align-items:stretch;padding:12px}.send .note{order:2;text-align:center;padding-top:10px}.send .btn{justify-content:center;padding:14px}}
</style>
<script src="favicon.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
const WORKER="https://eat-claude-proxy.mohammed-alsafwani.workers.dev";
let a=null;try{a=JSON.parse(localStorage.getItem("eat.account")||"null");}catch(e){}
if(a){document.getElementById("em").value=a.email||"";if(a.name)document.getElementById("nm").value=a.name;}
const f=document.getElementById("cf"),btn=f.querySelector(".send .btn"),note=f.querySelector(".send .note");
f.addEventListener("submit",async e=>{e.preventDefault();if(!f.checkValidity()){f.reportValidity();return;}
const body={name:document.getElementById("nm").value.trim(),email:document.getElementById("em").value.trim(),subject:document.getElementById("sj").value.trim(),message:document.getElementById("msg").value.trim(),website:document.getElementById("hp").value};
const label=btn.firstChild.textContent;btn.firstChild.textContent="Sending";btn.disabled=true;
try{const r=await fetch(WORKER+"/contact",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||"failed");
document.getElementById("echo").textContent=body.email;f.querySelector(".sent").classList.add("on");}
catch(err){btn.firstChild.textContent=label;btn.disabled=false;note.textContent="Couldn't send just now. Opening your email app instead.";
location.href="mailto:hello@theeat.app?subject="+encodeURIComponent(body.subject)+"&body="+encodeURIComponent(body.message+"\n\n"+body.name+" · "+body.email);}
});});
</script>
</head>
<body>
<header class="nav"><div class="wrap bar">
<a class="logo" href="index.html"><img src="icon-solo.png" alt="Eat"></a>
<nav class="links"><a href="pricing.html">Pricing</a><a href="faq.html">FAQ</a><a href="contact.html" aria-current="page">Contact</a></nav>
<div class="actions"><a class="btn btn-ghost" href="signin.html">Sign in</a><a class="btn btn-dark" href="https://theeat.app/ios">Get the app</a></div>
</div></header>
<script type="module" src="nav.js"></script>
<main class="ct">
<div>
<h1>Say hello<span class="dot">.</span></h1>
<p class="sub-l">A real person replies within a working day.</p>
<div class="routes">
<div><span class="k">Email</span><span class="v"><a href="mailto:hello@theeat.app">hello@theeat.app</a></span></div>
<div><span class="k">Billing</span><span class="v"><a href="account.html">Manage in your account</a></span></div>
<div><span class="k">Press</span><span class="v"><a href="mailto:press@theeat.app">press@theeat.app</a></span></div>
</div>
</div>
<form class="card" id="cf" novalidate>
<div class="fields">
<div class="f"><label for="nm">Name</label><input id="nm" autocomplete="name" placeholder="Your name" required maxlength="80"></div><div class="f"><label for="em">Email</label><input id="em" type="email" autocomplete="email" placeholder="you@somewhere.com" required></div>
<div class="f"><label for="sj">Subject</label><input id="sj" placeholder="What's it about?" required maxlength="120"></div>
<div class="f"><label for="msg">Message</label><textarea id="msg" rows="4" placeholder="Tell us what's going on." required maxlength="4000"></textarea></div>
<input id="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">
</div>
<div class="send"><span class="note">We reply to the email above.</span><button class="btn btn-dark" type="submit">Send<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
<div class="sent"><span class="tick"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><b>Sent.</b><span>We'll reply to <span id="echo"></span> within a working day.</span></div>
</form>
</main>
<div class="wrap one-foot"><nav class="one-links"><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="cookies.html">Cookies</a><a href="contact.html">Contact</a><span>© 2026 Eat</span></nav></div>
<script src="mobile.js"></script>
</body>
</html>
