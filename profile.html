<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Edit profile — Eat</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F1EA">
<link rel="icon" href="icon-solo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
html,body{height:100%}body{display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
.ed{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;width:min(1120px,calc(100% - 48px));margin:0 auto;padding:12px 0;overflow:auto}
.ed form{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(40px,7vw,120px);align-items:stretch}
.lead{display:flex;flex-direction:column;align-items:flex-start}
.stage{background:var(--card);border-radius:28px;box-shadow:0 1px 0 var(--line);padding:40px 32px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;position:relative;overflow:hidden;min-height:340px}.stage::before{content:"";position:absolute;inset:auto -40% -60% -40%;height:70%;background:radial-gradient(ellipse at 50% 100%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%)}.stage>*{position:relative}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--mid);margin-bottom:14px}.back:hover{color:var(--ink)}
.ed h1{font-size:clamp(34px,4.4vw,56px);letter-spacing:-.045em;line-height:1}.ed h1 .dot{color:var(--accent)}
.ed .sub-l{font-size:16px;color:var(--mid);margin-top:14px;max-width:34ch;line-height:1.45}
.avwrap{display:flex;flex-direction:column;align-items:center;gap:18px;margin:0}
.av{width:148px;height:148px;border-radius:50%;padding:3px;background:rgba(255,255,255,.6);box-shadow:0 0 0 .5px rgba(255,255,255,.9),0 18px 36px -16px var(--accent);position:relative;cursor:pointer;display:flex;transition:transform .45s var(--spring)}.av:hover{transform:scale(1.04)}.av.busy{opacity:.6}
.av>span{flex:1;border-radius:50%;background:radial-gradient(90% 90% at 32% 22%,var(--light),var(--accent) 62%,var(--deep));color:#FEF8F1;font-weight:700;font-size:60px;letter-spacing:-.04em;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;text-shadow:0 1px 1px rgba(0,0,0,.12)}.av>span.photo{color:transparent}
.av .cam{position:absolute;right:0;bottom:0;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--card)}
.av input{position:absolute;inset:0;opacity:0;cursor:pointer;border-radius:50%}
.avwrap .hint{font-size:14px;color:var(--mid);display:flex;gap:16px;align-items:center}.avwrap .hint span{font-weight:600;color:var(--ink)}.avwrap .hint button{font:inherit;color:var(--mid);background:none;border:0;padding:0;cursor:pointer;font-weight:500}.avwrap .hint button:hover{color:var(--ink)}
.stage .who{text-align:center}.stage .who b{display:block;font-size:20px;font-weight:700;letter-spacing:-.025em}.stage .who span{display:block;font-size:14px;color:var(--mid);margin-top:3px}
.right{display:flex;flex-direction:column;justify-content:center}
.fields{display:flex;flex-direction:column;gap:14px}
.f{background:var(--card);border-radius:20px;padding:18px 22px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:4px;transition:box-shadow .2s}.f:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.f label{font-size:12.5px;font-weight:600;color:var(--faint);letter-spacing:.02em}
.f input{font:inherit;font-size:19px;font-weight:600;color:var(--ink);border:0;background:transparent;outline:0;padding:0;width:100%;letter-spacing:-.01em}.f input[readonly]{color:var(--mid)}
.f .sub{font-size:12.5px;color:var(--faint);margin-top:2px}.f .sub b{color:var(--deep);font-weight:600}
.bar-actions{display:flex;gap:10px;margin-top:26px;align-items:center}
.bar-actions .spacer{flex:1}
.one-foot{margin-top:0;padding:16px 0 20px;flex:none}
.saved{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:10px 18px;border-radius:99px;transition:all .35s var(--spring);pointer-events:none;max-width:calc(100% - 32px);text-align:center}.saved.on{opacity:1;transform:translateX(-50%)}
@media (max-width:820px){body{overflow:auto}.ed form{grid-template-columns:1fr;gap:32px}}
/*m*/@media (max-width:760px){.ed{padding:20px 0 0;justify-content:flex-start;overflow:visible}.ed form{grid-template-columns:1fr;gap:20px}.stage{min-height:0;padding:28px 20px 24px;border-radius:24px}.av{width:120px;height:120px}.av>span{font-size:48px}.bar-actions{margin-top:18px}.bar-actions .btn{flex:1;justify-content:center}.bar-actions .spacer{display:none}}
</style>
<script src="favicon.js"></script>
</head>
<body>
<header class="nav"><div class="wrap bar">
<a class="logo" href="index.html"><img src="icon-solo.png" alt="Eat"></a>
<nav class="links"><a href="pricing.html">Pricing</a><a href="faq.html">FAQ</a><a href="contact.html">Contact</a></nav>
<div class="actions"><a class="btn btn-ghost" href="signin.html">Sign in</a></div>
</div></header>
<script type="module" src="nav.js"></script>
<main class="ed" style="visibility:hidden" id="main">
<div class="lead" style="margin-bottom:28px">
<a class="back" href="account.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Account</a>
<h1>Your profile<span class="dot">.</span></h1>
</div>
<form id="form">
<div class="stage">
<div class="avwrap">
<label class="av" id="av"><span id="avl">E</span><span class="cam"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.2"/></svg></span><input type="file" id="file" accept="image/*" aria-label="Choose photo"></label>
<div class="hint"><span>Change photo</span><button type="button" id="rm" hidden>Remove</button></div>
</div>
<div class="who"><b id="whoN"></b><span id="whoE"></span></div>
</div>
<div class="right">
<p class="sub-l" style="margin:0 0 18px">Your photo and name show in the app. Your email is how you sign in everywhere.</p>
<div class="fields">
<div class="f"><label for="name">Name</label><input id="name" autocomplete="name" maxlength="40"><div class="sub">How we greet you in the app.</div></div>
<div class="f"><label for="email">Email</label><input id="email" type="email" autocomplete="email" spellcheck="false" required><div class="sub" id="esub">Used to sign in on every device.</div></div>
</div>
<div class="bar-actions"><a class="btn btn-ghost" href="account.html">Cancel</a><span class="spacer"></span><button class="btn btn-dark" type="submit" id="save">Save</button></div>
</div>
</form>
</main>
<div class="saved" id="toast">Saved</div>
<div class="wrap one-foot"><nav class="one-links"><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="cookies.html">Cookies</a><a href="contact.html">Contact</a><span>© 2026 Eat</span></nav></div>
<script src="mobile.js"></script>

<script type="module">
import { auth, storage, WORKER } from "./firebase-init.js";
import { onUser, writeCache, toCache, fetchStatus, paintNav } from "./nav.js";
import { updateProfile, verifyBeforeUpdateEmail } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
import { ref as sref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-storage.js";
const $ = id => document.getElementById(id);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
let user = null, photo = null, toastT;
const toast = m => { $("toast").textContent = m; $("toast").classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => $("toast").classList.remove("on"), 2600); };
const name = $("name"), email = $("email"), avl = $("avl"), file = $("file"), rm = $("rm"), esub = $("esub");
const first = () => cap(((user && user.email) || "").split("@")[0].split(/[ .]/)[0] || "E");
const paint = () => {
  $("whoN").textContent = name.value.trim() || first(); $("whoE").textContent = email.value;
  if (photo) { avl.classList.add("photo"); avl.style.backgroundImage = "url(" + photo + ")"; rm.hidden = false; }
  else { avl.classList.remove("photo"); avl.style.backgroundImage = ""; avl.textContent = (name.value.trim() || first())[0].toUpperCase(); rm.hidden = true; }
};
async function refreshCache() { const s = await fetchStatus(auth.currentUser); const a = toCache(auth.currentUser, s); writeCache(a); paintNav(a); }

onUser(u => {
  if (!u) { location.replace("signin.html?next=profile.html"); return; }
  if (user) return; user = u;
  name.value = u.displayName || ""; email.value = u.email || ""; photo = u.photoURL || null;
  const emailAccount = (u.providerData || []).some(p => p.providerId === "password");
  if (!emailAccount) { email.readOnly = true; esub.textContent = "Signed in with " + ((u.providerData[0] || {}).providerId === "apple.com" ? "Apple" : "Google") + ". Your email is managed there."; }
  paint(); $("main").style.visibility = "visible";
});
name.addEventListener("input", paint);
email.addEventListener("input", () => { paint(); esub.textContent = email.value !== user.email ? "We'll send a link to the new address to confirm it." : "Used to sign in on every device."; });

// photo → Firebase Storage avatars/<uid>/photo.jpg + photoURL, so the app sees it too
file.addEventListener("change", () => {
  const f = file.files[0]; if (!f || !user) return;
  const img = new Image(); $("av").classList.add("busy");
  img.onload = async () => {
    const s = 512, c = document.createElement("canvas"); c.width = c.height = s;
    const x = c.getContext("2d"), m = Math.min(img.width, img.height);
    x.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
    c.toBlob(async blob => {
      try { const r = sref(storage, "avatars/" + user.uid + "/photo.jpg"); await uploadBytes(r, blob, { contentType: "image/jpeg" }); const url = await getDownloadURL(r); await updateProfile(auth.currentUser, { photoURL: url }); photo = url; paint(); refreshCache(); toast("Photo updated"); }
      catch (_) { toast("Couldn't upload the photo"); }
      $("av").classList.remove("busy");
    }, "image/jpeg", .86);
  };
  img.onerror = () => $("av").classList.remove("busy");
  img.src = URL.createObjectURL(f); file.value = "";
});
rm.addEventListener("click", async () => {
  try { await updateProfile(auth.currentUser, { photoURL: "" }); } catch (_) {}
  try { await deleteObject(sref(storage, "avatars/" + user.uid + "/photo.jpg")); } catch (_) {}
  photo = null; paint(); refreshCache(); toast("Photo removed");
});

$("form").addEventListener("submit", async e => {
  e.preventDefault(); if (!email.checkValidity()) { email.reportValidity(); return; }
  $("save").textContent = "Saving"; $("save").disabled = true;
  const newName = name.value.trim(), newEmail = email.value.trim();
  try {
    if (newName !== (user.displayName || "")) {
      await updateProfile(auth.currentUser, { displayName: newName });
      try { const idToken = await auth.currentUser.getIdToken(); await fetch(WORKER + "/profile", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ idToken, name: newName }) }); } catch (_) {}
    }
    let msg = "Saved";
    if (!email.readOnly && newEmail !== user.email) {
      try { await verifyBeforeUpdateEmail(auth.currentUser, newEmail); msg = "Saved. Check " + newEmail + " to confirm the change"; }
      catch (e2) { msg = e2.code === "auth/requires-recent-login" ? "Sign in again to change your email" : "Couldn't change the email"; }
    }
    await refreshCache(); toast(msg);
    setTimeout(() => location.href = "account.html", msg === "Saved" ? 700 : 1800);
  } catch (_) { toast("Couldn't save. Try again."); $("save").textContent = "Save"; $("save").disabled = false; }
});
</script>
</body>
</html>
