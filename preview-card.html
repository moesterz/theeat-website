<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #fdf8f2;
    font-family: "DM Sans", -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .bg-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
  }
  .blob1 { width: 500px; height: 500px; background: #ff6b35; top: -100px; right: -80px; }
  .blob2 { width: 400px; height: 400px; background: #ffd4b8; bottom: -100px; left: 100px; }
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 64px;
  }
  .icon {
    width: 160px;
    height: 160px;
    border-radius: 36px;
    box-shadow: 0 20px 60px rgba(255,107,53,0.4), 0 4px 16px rgba(45,31,14,0.15);
  }
  .text { display: flex; flex-direction: column; gap: 14px; }
  .app-name {
    font-size: 88px;
    font-weight: 700;
    color: #2d1f0e;
    line-height: 1;
    letter-spacing: -3px;
  }
  .app-name span { color: #ff6b35; }
  .tagline {
    font-size: 28px;
    font-weight: 400;
    color: #5c3d1e;
    letter-spacing: -0.3px;
  }
  .domain {
    font-size: 18px;
    font-weight: 500;
    color: #9c8572;
    letter-spacing: 0.05em;
    margin-top: 4px;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>
  <div class="content">
    <img class="icon" src="icon.png" alt="Eat app icon"/>
    <div class="text">
      <div class="app-name">Eat<span>.</span></div>
      <div class="tagline">Meals built around you.</div>
      <div class="domain">theeat.app</div>
    </div>
  </div>
</body>
</html>
